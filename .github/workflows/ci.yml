name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated fixed-asset artifact
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm compile
        working-directory: contracts/testnet-fixed-asset
      - name: Prepare Venus evidence dependency graph
        run: corepack pnpm install --frozen-lockfile
        working-directory: agents/healthFactorGuardianAgent/app/agent
      - name: Prepare LP evidence dependency graph
        run: corepack pnpm install --frozen-lockfile
        working-directory: agents/lpRangeAgent/app/agent
      - name: Prepare grid evidence dependency graph
        run: corepack pnpm install --frozen-lockfile
        working-directory: agents/gridTradingAgent/app/agent
      - name: Prepare yield evidence dependency graph
        run: corepack pnpm install --frozen-lockfile
        working-directory: agents/yieldOptimisationAgent/app/agent
      - name: Prepare browser and media evidence tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm verify
      - name: Generate production license evidence
        run: |
          pnpm licenses list --prod --json > "$RUNNER_TEMP/production-licenses.json"
          PROOFERA_PNPM_VERSION="$(pnpm --version)" node scripts/create-license-provenance.mjs \
            "$RUNNER_TEMP/production-licenses.json" \
            "$RUNNER_TEMP/production-license-provenance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-license-inventory
          path: |
            ${{ runner.temp }}/production-licenses.json
            ${{ runner.temp }}/production-license-provenance.json
          if-no-files-found: error
          retention-days: 30

  postgres-live:
    name: postgres / canonical activation ledgers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Official Image postgres:17.9-bookworm, index digest checked 2026-08-11.
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_DB: proofera_postgres_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=proofera_postgres_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical LP reservation migration, ACLs, concurrency, and append-only behavior
        env:
          PROOFERA_RUN_POSTGRES_INTEGRATION: "1"
        run: |
          PROOFERA_POSTGRES_TEST_URL="$(node -e "process.stdout.write(['postgresql', '://postgres', ':ci-proof-only', '@127.0.0.1', ':5432/proofera_postgres_integration'].join(''))")"
          export PROOFERA_POSTGRES_TEST_URL
          pnpm --filter @proofera/integrations exec vitest run src/altana-lp-postgres.live.test.ts
      - name: Verify canonical grant-claim migration and same-pool commit boundary
        env:
          PROOFERA_RUN_POSTGRES_INTEGRATION: "1"
        run: |
          PROOFERA_POSTGRES_TEST_URL="$(node -e "process.stdout.write(['postgresql', '://postgres', ':ci-proof-only', '@127.0.0.1', ':5432/proofera_postgres_integration'].join(''))")"
          export PROOFERA_POSTGRES_TEST_URL
          pnpm --filter @proofera/integrations exec vitest run src/altana-grant-claim-postgres.live.test.ts

  reference-agents:
    name: reference-agent / ${{ matrix.agent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: lp-range
            path: agents/lpRangeAgent
            lockfile: agents/lpRangeAgent/pnpm-lock.yaml
          - agent: grid-trading
            path: agents/gridTradingAgent
            lockfile: agents/gridTradingAgent/pnpm-lock.yaml
          - agent: yield-optimisation
            path: agents/yieldOptimisationAgent/app/agent
            lockfile: agents/yieldOptimisationAgent/app/agent/pnpm-lock.yaml
          - agent: health-factor-guardian
            path: agents/healthFactorGuardianAgent
            lockfile: agents/healthFactorGuardianAgent/pnpm-lock.yaml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: ${{ matrix.path }}
      - run: corepack pnpm verify
        working-directory: ${{ matrix.path }}
      - run: corepack pnpm audit:prod
        working-directory: ${{ matrix.path }}

  testnet-fixed-asset:
    name: contract / fixed test asset
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: contracts/testnet-fixed-asset
      - run: corepack pnpm verify
        working-directory: contracts/testnet-fixed-asset

  testnet-hire-receipt:
    name: contract / paid hire receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: contracts/testnet-hire-receipt
      - run: corepack pnpm verify
        working-directory: contracts/testnet-hire-receipt

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
